name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Railway secrets
        run: |
          [ -n "${{ secrets.RAILWAY_TOKEN }}" ] || { echo "RAILWAY_TOKEN missing"; exit 1; }
          [ -n "${{ secrets.RAILWAY_SERVICE_NAME }}" ] || { echo "RAILWAY_SERVICE_NAME missing"; exit 1; }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway via CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          railway up --service "$SERVICE_NAME" --ci

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Frontend deployment is manual on Replit
        run: |
          echo "::notice title=Replit deployment::Frontend deployment is manual on Replit. Skipping automated deploy."

